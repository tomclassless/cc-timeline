[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cc-timeline"
version = "0.1.0"
description = "Where did the time go in your Claude Code sessions? Time attribution from local transcripts."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
authors = [{ name = "Masaka" }]
keywords = ["claude-code", "claude", "transcript", "profiling", "timeline", "subagents", "observability"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development",
  "Topic :: Utilities",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/tomclassless/cc-timeline"
Issues = "https://github.com/tomclassless/cc-timeline/issues"
Changelog = "https://github.com/tomclassless/cc-timeline/blob/main/CHANGELOG.md"

[project.optional-dependencies]
test = ["pytest"]

[project.scripts]
cc-timeline = "cc_timeline.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/cc_timeline"]

[tool.pytest.ini_options]
testpaths = ["tests"]
