<!doctype html>
<html lang="__LANG__">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>cc-timeline</title>
<style>
:root {
  --page: #f9f9f7; --surface: #fcfcfb; --ink: #0b0b0b; --ink-2: #52514e; --muted: #898781;
  --grid: #e1e0d9; --axis: #c3c2b7; --border: #e1e0d9;
  --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a; --s4: #eda100; --s5: #e87ba4; --s6: #008300; --s7: #6250d6;
}
@media (prefers-color-scheme: dark) {
  :root {
    --page: #0d0d0d; --surface: #1a1a19; --ink: #f0efec; --ink-2: #c3c2b7; --muted: #898781;
    --grid: #2c2c2a; --axis: #383835; --border: #2c2c2a;
    --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500; --s5: #d55181; --s6: #008300; --s7: #9085e9;
  }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--page); color: var(--ink);
  font: 14px/1.5 -apple-system, BlinkMacSystemFont, "PingFang TC", "Noto Sans TC", "Segoe UI", sans-serif;
  font-variant-numeric: tabular-nums; }
main { max-width: 1100px; margin: 0 auto; padding: 24px 16px 48px; }
h1 { font-size: 22px; margin: 0 0 4px; }
h2 { font-size: 16px; margin: 0 0 2px; }
.meta, .sub { color: var(--ink-2); margin: 0; }
.sub { font-size: 13px; margin-bottom: 12px; }
.card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px;
  padding: 16px; margin-top: 16px; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.grid2 .card { margin-top: 0; }
@media (max-width: 760px) { .grid2 { grid-template-columns: 1fr; } }
.tiles { display: grid; grid-template-columns: repeat(5, 1fr); gap: 12px; margin-top: 16px; }
@media (max-width: 760px) { .tiles { grid-template-columns: repeat(2, 1fr); } }
.tile { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 12px 14px; }
.tile .label { color: var(--ink-2); font-size: 13px; display: flex; align-items: center; gap: 6px; }
.tile .value { font-size: 26px; font-weight: 600; margin-top: 2px; }
.tile .note { color: var(--muted); font-size: 12px; }
.sw { width: 10px; height: 10px; border-radius: 3px; display: inline-block; flex: none; }
.legend { display: flex; flex-wrap: wrap; gap: 4px 14px; margin: 0 0 8px; color: var(--ink-2); font-size: 13px; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
svg { display: block; width: 100%; overflow: visible; }
svg text { fill: var(--muted); font-size: 11px; }
svg .ink { fill: var(--ink-2); font-size: 12px; }
svg .grid { stroke: var(--grid); stroke-width: 1; }
svg .axis { stroke: var(--axis); stroke-width: 1; }
.hit:hover { opacity: .85; }
details { margin-top: 10px; }
summary { cursor: pointer; color: var(--ink-2); font-size: 13px; }
.scroll { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: 13px; margin-top: 8px; }
th, td { text-align: right; padding: 5px 8px; border-bottom: 1px solid var(--border); white-space: nowrap; }
th:first-child, td:first-child, th.l, td.l { text-align: left; }
th { color: var(--ink-2); font-weight: 500; }
th.sort { cursor: pointer; user-select: none; }
th.sort:hover { color: var(--ink); }
select { max-width: 100%; margin: 0 0 10px; padding: 4px 8px; border: 1px solid var(--border);
  border-radius: 8px; background: var(--surface); color: var(--ink); font: inherit; }
.hatch { background: repeating-linear-gradient(45deg, var(--muted) 0 1px, var(--axis) 1px 4px); }
footer { margin-top: 24px; color: var(--muted); font-size: 12px; }
footer .warn { color: var(--s2); margin: 0 0 4px; }
#tip { position: fixed; pointer-events: none; background: var(--surface); color: var(--ink);
  border: 1px solid var(--border); border-radius: 8px; padding: 8px 10px; font-size: 12px;
  box-shadow: 0 4px 16px rgba(0,0,0,.12); display: none; z-index: 10; max-width: 280px; }
#tip b { font-weight: 600; }
.empty { color: var(--muted); padding: 24px 0; text-align: center; }
</style>
</head>
<body>
<main>
  <h1 data-l="app_title"></h1>
  <p class="meta" id="meta"></p>
  <div class="tiles" id="tiles"></div>

  <section class="card">
    <h2 data-l="daily_title"></h2>
    <p class="sub" data-l="daily_sub"></p>
    <div class="legend" id="dailyLegend"></div>
    <div id="daily"></div>
    <details><summary data-l="table"></summary><div class="scroll" id="dailyTable"></div></details>
  </section>

  <section class="card">
    <h2 data-l="items_title"></h2>
    <p class="sub" data-l="items_sub"></p>
    <div class="legend" id="itemsLegend"></div>
    <div id="items"></div>
    <details><summary data-l="table"></summary><div class="scroll" id="itemsTable"></div></details>
  </section>

  <section class="card" id="tlCard">
    <h2 data-l="tl_title"></h2>
    <p class="sub" data-l="tl_sub"></p>
    <select id="tlSel" aria-label="session"></select>
    <div class="legend" id="tlLegend"></div>
    <div class="scroll" id="tl"></div>
    <details><summary data-l="table"></summary><div class="scroll" id="tlTable"></div></details>
  </section>

  <section class="card">
    <h2 data-l="agents_title"></h2>
    <p class="sub" data-l="agents_sub"></p>
    <div class="legend" id="agentsLegend"></div>
    <div id="agents"></div>
    <details><summary data-l="table"></summary><div class="scroll" id="agentsTable"></div></details>
  </section>

  <div class="grid2" style="margin-top:16px">
    <section class="card">
      <h2 data-l="dur_title"></h2>
      <p class="sub" data-l="dur_sub"></p>
      <div class="legend" id="durLegend"></div>
      <div id="dur"></div>
    </section>
    <section class="card">
      <h2 data-l="think_title"></h2>
      <p class="sub" data-l="think_sub"></p>
      <div class="legend" id="thinkLegend"></div>
      <div id="think"></div>
    </section>
  </div>

  <section class="card">
    <h2 data-l="sessions_title"></h2>
    <p class="sub" data-l="sessions_sub"></p>
    <div class="scroll" id="sessions"></div>
  </section>
  <footer id="foot"></footer>
</main>
<div id="tip"></div>

<script id="data" type="application/json">__DATA__</script>
<script>
const D = JSON.parse(document.getElementById("data").textContent);
const L = D.labels;
const tpl = (k, o = {}) => L[k].replace(/\{(\w+)\}/g, (_, n) => o[n]);
const G = g => L["g_" + g];
document.title = L.app_title;
document.querySelectorAll("[data-l]").forEach(n => n.textContent = L[n.dataset.l]);
const C = i => `var(--s${i + 1})`;
const BUCKETS = [["model", L.b_model], ["tool", L.b_tool], ["bg", L.b_bg], ["user", L.b_user]];
const NS = "http://www.w3.org/2000/svg";

function fmt(sec) {
  sec = Math.round(sec);
  const h = Math.floor(sec / 3600), m = Math.floor(sec % 3600 / 60), s = sec % 60;
  if (h) return `${h}h${String(m).padStart(2, "0")}m`;
  if (m) return `${m}m${String(s).padStart(2, "0")}s`;
  return `${s}s`;
}
const pct = (a, b) => b ? `${Math.round(a / b * 100)}%` : "-";
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;"}[c]));
const sum = a => a.reduce((x, y) => x + y, 0);

function el(tag, attrs = {}, parent) {
  const e = document.createElementNS(NS, tag);
  for (const [k, v] of Object.entries(attrs)) e.setAttribute(k, v);
  if (parent) parent.appendChild(e);
  return e;
}
function svg(host, h) {
  host.innerHTML = "";
  const w = host.clientWidth || 600;
  const s = el("svg", {viewBox: `0 0 ${w} ${h}`, height: h}, host);
  return [s, w];
}
// Round only the data end of a bar: dir = "top" (vertical) or "right" (horizontal)
function bar(parent, x, y, w, h, r, dir, fill) {
  r = Math.max(0, Math.min(r, dir === "top" ? w / 2 : h / 2, dir === "top" ? h : w));
  const d = dir === "top"
    ? `M${x},${y + h}V${y + r}Q${x},${y} ${x + r},${y}H${x + w - r}Q${x + w},${y} ${x + w},${y + r}V${y + h}Z`
    : `M${x},${y}H${x + w - r}Q${x + w},${y} ${x + w},${y + r}V${y + h - r}Q${x + w},${y + h} ${x + w - r},${y + h}H${x}Z`;
  return el("path", {d, fill, class: "hit"}, parent);
}
function niceMax(v) {
  if (v <= 0) return 1;
  const p = Math.pow(10, Math.floor(Math.log10(v))), n = v / p;
  return (n <= 1 ? 1 : n <= 2 ? 2 : n <= 5 ? 5 : 10) * p;
}

const tip = document.getElementById("tip");
function hover(node, html) {
  node.addEventListener("mousemove", e => {
    tip.innerHTML = html; tip.style.display = "block";
    const x = Math.min(e.clientX + 14, innerWidth - tip.offsetWidth - 8);
    const y = Math.min(e.clientY + 14, innerHeight - tip.offsetHeight - 8);
    tip.style.left = x + "px"; tip.style.top = y + "px";
  });
  node.addEventListener("mouseleave", () => tip.style.display = "none");
}
// Agent phases in the validated categorical order, so think = model (s1), read = tool (s2),
// test = s5 and polling = s7 match the session timeline.
const AGENT_ORDER = ["think", "read", "code", "gen", "test", "other", "poll"]
  .filter(g => D.phaseGroups.includes(g)).concat(D.phaseGroups.filter(g => !["think", "read", "code", "gen", "test", "other", "poll"].includes(g)));
function legend(id, names) {
  document.getElementById(id).innerHTML = names.map((n, i) =>
    `<span><i class="sw" style="background:${C(i)}"></i>${esc(n)}</span>`).join("");
}
function table(id, head, rows) {
  document.getElementById(id).innerHTML = `<table><thead><tr>${head.map(h => `<th>${esc(h)}</th>`).join("")}</tr></thead>
    <tbody>${rows.map(r => `<tr>${r.map(c => `<td>${esc(c)}</td>`).join("")}</tr>`).join("")}</tbody></table>`;
}
function empty(id, msg) { document.getElementById(id).innerHTML = `<div class="empty">${msg}</div>`; }

// -- header and tiles --
const T = D.totals, busy = sum(BUCKETS.map(([k]) => T[k] || 0));
document.getElementById("meta").textContent =
  tpl("meta", {project: D.project, period: D.period, n: D.sessionCount, errors: D.apiErrors, generated: D.generated});
document.getElementById("tiles").innerHTML =
  `<div class="tile"><div class="label">${esc(L.tile_active)}</div><div class="value">${fmt(busy)}</div>
     <div class="note">${esc(tpl("tile_idle", {t: fmt(T.idle || 0)}))}</div></div>` +
  BUCKETS.map(([k, n], i) => `<div class="tile"><div class="label"><i class="sw" style="background:${C(i)}"></i>${n}</div>
     <div class="value">${pct(T[k] || 0, busy)}</div><div class="note">${fmt(T[k] || 0)}</div></div>`).join("");

// -- daily stacked columns --
function drawDaily() {
  const host = document.getElementById("daily");
  if (!D.daily.length) return empty("daily", L.no_data);
  const H = 240, m = {l: 40, r: 8, t: 10, b: 26};
  const [s, W] = svg(host, H);
  const max = niceMax(Math.max(...D.daily.map(d => sum(BUCKETS.map(([k]) => d[k] || 0)))) / 3600);
  const y = v => m.t + (H - m.t - m.b) * (1 - v / max);
  for (let i = 0; i <= 4; i++) {
    const v = max * i / 4;
    el("line", {x1: m.l, x2: W - m.r, y1: y(v), y2: y(v), class: i ? "grid" : "axis"}, s);
    el("text", {x: m.l - 6, y: y(v) + 4, "text-anchor": "end"}, s).textContent = `${+v.toFixed(1)}h`;
  }
  const band = (W - m.l - m.r) / D.daily.length, bw = Math.min(24, band * .6);
  const every = Math.ceil(D.daily.length / Math.max(1, Math.floor((W - m.l) / 56)));
  D.daily.forEach((d, i) => {
    const x = m.l + band * i + (band - bw) / 2, total = sum(BUCKETS.map(([k]) => d[k] || 0));
    let acc = 0;
    const segs = BUCKETS.map(([k], j) => [k, j, (d[k] || 0) / 3600]).filter(([, , v]) => v > 0);
    segs.forEach(([k, j, v], idx) => {
      const top = y(acc + v), bottom = y(acc), last = idx === segs.length - 1;
      const h = Math.max(0, bottom - top - (acc > 0 ? 2 : 0));
      const p = bar(s, x, top, bw, h, last ? 4 : 0, "top", C(j));
      hover(p, `<b>${d.date}</b><br>` + tpl("tip_daily", {bucket: esc(BUCKETS[j][1]), t: fmt(d[k]), p: pct(d[k], total), total: fmt(total)}));
      acc += v;
    });
    if (i % every === 0)
      el("text", {x: x + bw / 2, y: H - 8, "text-anchor": "middle"}, s).textContent = d.date.slice(5);
  });
}
legend("dailyLegend", BUCKETS.map(b => b[1]));
table("dailyTable", [L.h_date, ...BUCKETS.map(b => b[1]), L.h_total],
  D.daily.map(d => [d.date, ...BUCKETS.map(([k]) => fmt(d[k] || 0)), fmt(sum(BUCKETS.map(([k]) => d[k] || 0)))]));

// -- top 15 horizontal bars --
const KIND = {tool: [1, L.k_tool], bg: [2, L.k_bg]};
function drawItems() {
  const host = document.getElementById("items");
  if (!D.items.length) return empty("items", L.no_data);
  const row = 28, H = D.items.length * row + 4;
  const [s, W] = svg(host, H);
  const lw = Math.min(260, W * .38), vw = 64, max = D.items[0].sec;
  const total = sum(D.items.map(i => i.sec));
  D.items.forEach((it, i) => {
    const yy = i * row + 4, w = Math.max(2, (W - lw - vw) * it.sec / max);
    const t = el("text", {x: lw - 10, y: yy + 14, "text-anchor": "end", class: "ink"}, s);
    t.textContent = it.name.length > 26 ? it.name.slice(0, 25) + "…" : it.name;
    const p = bar(s, lw, yy + 2, w, 16, 4, "right", C(KIND[it.kind][0]));
    hover(p, `<b>${esc(it.name)}</b><br>` + tpl("tip_item", {kind: KIND[it.kind][1], n: it.n, t: fmt(it.sec), avg: fmt(it.sec / it.n)}));
    el("text", {x: lw + w + 6, y: yy + 14}, s).textContent = fmt(it.sec);
  });
}
document.getElementById("itemsLegend").innerHTML =
  `<span><i class="sw" style="background:${C(1)}"></i>${esc(L.b_tool)}</span><span><i class="sw" style="background:${C(2)}"></i>${esc(L.b_bg)}</span>`;
table("itemsTable", [L.h_item, L.h_type, L.h_calls, L.h_time, L.h_avg],
  D.items.map(i => [i.name, KIND[i.kind][1], i.n, fmt(i.sec), fmt(i.sec / i.n)]));

// -- session timeline (gantt) --
const TL = D.timeline;
const GAP_W = 24, TL_MIN_W = 640;
// One meaning, one colour: model = s1, tool = s2, test/build = s5, polling = s7, waiting for you = s4.
const TL_FILL = {model: C(0), tool: C(1), user: C(3), bg: "url(#hatch)", idle: null,
  think: C(0), code: C(0), gen: C(0), read: C(1), other: C(1), test: C(4), poll: C(6)};
const TL_MAIN_NAME = {model: L.b_model, tool: L.b_tool, bg: L.tl_bg, user: L.b_user};
const clock = (s, t) => { const x = (s.clock0 + t) % 86400, p = n => String(n).padStart(2, "0");
  return `${p(Math.floor(x / 3600))}:${p(Math.floor(x % 3600 / 60))}:${p(x % 60)}`; };
document.getElementById("tlLegend").innerHTML = [
  [C(0), L.b_model], [C(1), L.b_tool], [C(4), L.g_test], [C(6), L.g_poll], [C(3), L.b_user]]
  .map(([c, n]) => `<span><i class="sw" style="background:${c}"></i>${esc(n)}</span>`).join("") +
  `<span><i class="sw hatch"></i>${esc(L.tl_bg)}</span>`;
function drawTimeline() {
  const card = document.getElementById("tlCard");
  if (!TL.sessions.length) { card.style.display = "none"; return; }
  const sel = document.getElementById("tlSel");
  if (!sel.options.length) {
    TL.sessions.forEach((s, i) => sel.add(new Option(
      tpl("tl_opt", {start: s.start, project: s.project, total: fmt(s.wall)}), i)));
    sel.value = TL.default;
    sel.onchange = drawTimeline;
  }
  const S = TL.sessions[+sel.value], host = document.getElementById("tl");
  const rows = [{name: L.tl_main, segs: S.main, main: true}];
  const lanes = [];
  S.agents.forEach(a => {
    if (!lanes[a.row]) { lanes[a.row] = {name: a.type, segs: []}; rows.push(lanes[a.row]); }
    lanes[a.row].segs.push(...a.segs.map(g => [...g, a]));
  });
  const extent = Math.max(S.wall, ...S.main.map(g => g[1]), ...S.agents.map(a => a.end), 1);
  const lw = 128, top = 22, rowH = 26, H = top + rows.length * rowH + 24;
  const hostW = host.clientWidth || TL_MIN_W, W = Math.max(hostW, TL_MIN_W);
  host.innerHTML = "";
  const s = el("svg", {viewBox: `0 0 ${W} ${H}`, height: H, width: W}, host);
  if (W > hostW) s.style.width = W + "px";
  const defs = el("defs", {}, s);
  const pat = el("pattern", {id: "hatch", width: 5, height: 5, patternUnits: "userSpaceOnUse", patternTransform: "rotate(45)"}, defs);
  el("rect", {width: 5, height: 5, fill: "var(--axis)"}, pat);
  el("line", {x1: 0, y1: 0, x2: 0, y2: 5, stroke: "var(--muted)", "stroke-width": 1.5}, pat);
  // Time axis with the away stretches collapsed to fixed-width breaks.
  const gaps = S.gaps, right = 12;
  const kept = extent - sum(gaps.map(g => g[1] - g[0]));
  const scale = Math.max(W - lw - right - GAP_W * gaps.length, 40) / Math.max(kept, 1);
  const X = t => {
    let saved = 0, off = 0;
    for (const [a, b] of gaps) {
      if (t >= b) { saved += b - a; off += GAP_W; } else { if (t > a) saved += t - a; break; }
    }
    return lw + (t - saved) * scale + off;
  };
  const bottom = top + rows.length * rowH;
  el("line", {x1: lw, x2: W - right, y1: bottom, y2: bottom, class: "axis"}, s);
  const steps = [5, 10, 30, 60, 120, 300, 600, 900, 1800, 3600, 7200, 14400, 28800, 86400];
  const step = steps.find(v => v * scale >= 70) || steps[steps.length - 1];
  for (let t = 0; t <= extent; t += step) {
    if (gaps.some(([a, b]) => t > a && t < b)) continue;
    el("line", {x1: X(t), x2: X(t), y1: top, y2: bottom, class: "grid"}, s);
    el("text", {x: X(t), y: bottom + 14, "text-anchor": "middle"}, s).textContent = fmt(t);
  }
  gaps.forEach(([a, b]) => {
    const x = X(a);
    el("rect", {x, y: top, width: GAP_W, height: bottom - top, fill: "var(--page)"}, s);
    el("line", {x1: x, x2: x, y1: top, y2: bottom, class: "axis", "stroke-dasharray": "3 3"}, s);
    el("line", {x1: x + GAP_W, x2: x + GAP_W, y1: top, y2: bottom, class: "axis", "stroke-dasharray": "3 3"}, s);
    el("text", {x: x + GAP_W / 2, y: top - 8, "text-anchor": "middle"}, s).textContent = tpl("tl_gap", {t: fmt(b - a)});
  });
  rows.forEach((row, i) => {
    const y = top + i * rowH + 4;
    const label = row.name.length > 18 ? row.name.slice(0, 17) + "…" : row.name;
    el("text", {x: lw - 8, y: y + 12, "text-anchor": "end", class: "ink"}, s).textContent = label;
    row.segs.forEach(([a, b, cat, ag]) => {
      const fill = TL_FILL[cat];
      if (!fill) return;
      const x1 = X(a), r = el("rect", {x: x1, y, width: Math.max(1, X(b) - x1), height: 18, rx: 2, fill,
        stroke: "var(--surface)", "stroke-width": 1.5, class: "hit"}, s);
      const name = row.main ? TL_MAIN_NAME[cat] : G(cat);
      hover(r, `<b>${esc(row.name)}</b> · ${esc(name)}<br>` + tpl("tl_tip",
        {start: clock(S, a), end: clock(S, b), dur: fmt(b - a)}));
    });
  });
  if (!S.agents.length) empty("tlTable", L.tl_none);
  else table("tlTable", [L.h_agent, L.h_begin, L.h_end, L.h_dur], S.agents.map(a =>
    [a.type, clock(S, a.start), clock(S, a.end), fmt(a.end - a.start)]));
}

// -- agent internals, 100% stacked bars --
function drawAgents() {
  const host = document.getElementById("agents");
  if (!D.agents.length) return empty("agents", L.no_agent_files);
  const row = 44, H = D.agents.length * row;
  const [s, W] = svg(host, H);
  const lw = Math.min(170, W * .3), rw = 110, bwMax = W - lw - rw;
  D.agents.forEach((a, i) => {
    const yy = i * row + 6, total = sum(Object.values(a.phases));
    el("text", {x: lw - 10, y: yy + 13, "text-anchor": "end", class: "ink"}, s).textContent = a.type;
    el("text", {x: lw - 10, y: yy + 28, "text-anchor": "end"}, s).textContent = tpl("runs", {n: a.runs});
    const segs = AGENT_ORDER.map((g, j) => [g, j, a.phases[g] || 0]).filter(([, , v]) => v > 0);
    let x = lw;
    segs.forEach(([g, j, v], idx) => {
      const last = idx === segs.length - 1, w = bwMax * v / total;
      const p = bar(s, x, yy + 4, Math.max(0, w - (last ? 0 : 2)), 20, last ? 4 : 0, "right", C(j));
      hover(p, `<b>${esc(a.type)}</b> · ${esc(G(g))}<br>` + tpl("tip_agent", {t: fmt(v), p: pct(v, total), avg: fmt(v / a.runs)}));
      x += w;
    });
    el("text", {x: lw + bwMax + 8, y: yy + 13, class: "ink"}, s).textContent = tpl("avg_x", {t: fmt(total / a.runs)});
    el("text", {x: lw + bwMax + 8, y: yy + 28}, s).textContent = tpl("total_x", {t: fmt(total)});
  });
}
legend("agentsLegend", AGENT_ORDER.map(G));
table("agentsTable", [L.h_agent, L.h_runs, L.h_avg, ...D.phaseGroups.map(G)],
  D.agents.map(a => { const t = sum(Object.values(a.phases));
    return [a.type, a.runs, fmt(t / a.runs), ...D.phaseGroups.map(g => `${fmt(a.phases[g] || 0)}（${pct(a.phases[g] || 0, t)}）`)]; }));

// -- trend lines (one y axis per chart) --
const TREND_TYPES = D.agents.slice(0, 3).map(a => a.type);
const dates = [...new Set(D.agentDaily.map(d => d.date))].sort();
function drawLine(id, value, yfmt) {
  const host = document.getElementById(id);
  if (!dates.length) return empty(id, L.no_agent_data);
  const H = 200, m = {l: 44, r: 12, t: 10, b: 26};
  const [s, W] = svg(host, H);
  const series = TREND_TYPES.map(t => dates.map(d => {
    const r = D.agentDaily.find(x => x.date === d && x.type === t);
    return r ? {d, v: value(r), r} : null;
  }));
  const max = niceMax(Math.max(...series.flat().filter(Boolean).map(p => p.v), 0) * 1.05);
  const x = i => dates.length === 1 ? (m.l + W - m.r) / 2 : m.l + (W - m.l - m.r) * i / (dates.length - 1);
  const y = v => m.t + (H - m.t - m.b) * (1 - v / max);
  for (let i = 0; i <= 4; i++) {
    const v = max * i / 4;
    el("line", {x1: m.l, x2: W - m.r, y1: y(v), y2: y(v), class: i ? "grid" : "axis"}, s);
    el("text", {x: m.l - 6, y: y(v) + 4, "text-anchor": "end"}, s).textContent = yfmt(v);
  }
  const every = Math.ceil(dates.length / Math.max(1, Math.floor((W - m.l) / 56)));
  dates.forEach((d, i) => { if (i % every === 0)
    el("text", {x: x(i), y: H - 8, "text-anchor": "middle"}, s).textContent = d.slice(5); });
  series.forEach((pts, j) => {
    let path = "";
    pts.forEach((p, i) => { if (p) path += `${path && pts[i - 1] ? "L" : "M"}${x(i)},${y(p.v)}`; });
    el("path", {d: path, fill: "none", stroke: C(j), "stroke-width": 2, "stroke-linejoin": "round", "stroke-linecap": "round"}, s);
    pts.forEach((p, i) => {
      if (!p) return;
      el("circle", {cx: x(i), cy: y(p.v), r: 4, fill: C(j), stroke: "var(--surface)", "stroke-width": 2}, s);
      const hit = el("circle", {cx: x(i), cy: y(p.v), r: 12, fill: "transparent"}, s);
      hover(hit, `<b>${esc(TREND_TYPES[j])}</b> · ${p.d}<br>` + tpl("tip_trend", {n: p.r.runs, avg: fmt(p.r.total / p.r.runs), think: pct(p.r.think, p.r.total)}));
    });
  });
}
legend("durLegend", TREND_TYPES);
legend("thinkLegend", TREND_TYPES);

// -- sessions table (sortable) --
const COLS = [["start", L.h_start, "l"], ["project", L.h_project, "l"], ["id", L.h_session, "l"], ["wall", L.h_wall],
  ["model", L.col_model], ["tool", L.col_tool], ["bg", L.col_bg], ["user", L.col_user], ["idle", L.col_idle], ["errors", L.h_errors], ["top", L.h_top, "l"]];
let sortKey = "start", sortDir = -1;
function drawSessions() {
  const rows = [...D.sessions].sort((a, b) => (a[sortKey] > b[sortKey] ? 1 : a[sortKey] < b[sortKey] ? -1 : 0) * sortDir);
  const cell = (r, k) => {
    if (["wall", "idle"].includes(k)) return fmt(r[k]);
    if (["model", "tool", "bg", "user"].includes(k)) {
      const b = r.model + r.tool + r.bg + r.user;
      return `${pct(r[k], b)} <span style="color:var(--muted)">${fmt(r[k])}</span>`;
    }
    return esc(r[k]);
  };
  document.getElementById("sessions").innerHTML = `<table><thead><tr>${COLS.map(([k, n, a]) =>
    `<th class="sort ${a || ""}" data-k="${k}">${n}${k === sortKey ? (sortDir > 0 ? " ▲" : " ▼") : ""}</th>`).join("")}</tr></thead>
    <tbody>${rows.map(r => `<tr>${COLS.map(([k, , a]) => `<td class="${a || ""}">${cell(r, k)}</td>`).join("")}</tr>`).join("")}</tbody></table>`;
  document.querySelectorAll("#sessions th").forEach(th => th.onclick = () => {
    const k = th.dataset.k;
    sortDir = k === sortKey ? -sortDir : (["start", "project", "id", "top"].includes(k) ? 1 : -1);
    sortKey = k; drawSessions();
  });
}

const fv = D.format.versions;
document.getElementById("foot").innerHTML =
  (D.formatWarning ? `<p class="warn">${esc(D.formatWarning)}</p>` : "") +
  (fv.min ? `<p>${esc(tpl("format_versions", {min: fv.min, max: fv.max}))}</p>` : "");

function drawAll() {
  drawTimeline(); drawDaily(); drawItems(); drawAgents();
  drawLine("dur", r => r.total / r.runs / 60, v => `${Math.round(v)}m`);
  drawLine("think", r => r.think / r.total * 100, v => `${Math.round(v)}%`);
}
drawAll(); drawSessions();
let rt; addEventListener("resize", () => { clearTimeout(rt); rt = setTimeout(drawAll, 150); });
</script>
</body>
